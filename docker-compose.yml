version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sportsev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  retrain:
    build: .
    command: >
      sh -c "while true; do python -m scripts.retrain; sleep 86400; done"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
